<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#brandGrad)" stroke-width="8" opacity="0.4" />
  <!-- Stylized Ledger / Register Mark -->
  <g transform="translate(106, 96)">
    <!-- Back page -->
    <rect x="40" y="20" width="240" height="300" rx="24" fill="#1e293b" opacity="0.8" />
    <!-- Front page with glow -->
    <rect x="10" y="40" width="240" height="300" rx="24" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="6" />
    <!-- Register lines -->
    <rect x="40" y="80" width="120" height="16" rx="8" fill="url(#brandGrad)" />
    <rect x="40" y="120" width="180" height="12" rx="6" fill="#334155" />
    <rect x="40" y="150" width="150" height="12" rx="6" fill="#334155" />
    <rect x="40" y="180" width="170" height="12" rx="6" fill="#334155" />
    <!-- Checkmark/tally pill -->
    <circle cx="190" cy="250" r="32" fill="url(#brandGrad)" filter="url(#glow)" />
    <path d="M178 250 L186 258 L204 240" fill="none" stroke="#090d16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
